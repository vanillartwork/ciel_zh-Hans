name: 校验翻译数据

# Everything here runs without the game. That is the point of the data format:
# the checks that catch "the translation is fine but the game breaks" -- lost
# control codes, extra line breaks, overlong packed fields -- all work off the
# metadata stored beside each translation, so CI needs no game files and none
# are ever uploaded.

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - "native/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
      - "native/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-game-data:
    name: 仓库中不得含有游戏文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否混入了游戏原始文件
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -Ei '\.(pak|g1t|psarc|gtx|gmd|gsk|g1s|gan|kcm)$|CielnosurgeDX.*\.exe$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::这些文件属于游戏原始资源，不应提交到仓库："
            echo "$bad"
            exit 1
          fi
          echo "没有发现游戏原始文件。"

      - name: 检查是否有异常大的文件
        run: |
          set -euo pipefail
          big=$(git ls-files -z | xargs -0 -I{} sh -c \
            'size=$(wc -c < "{}"); [ "$size" -gt 5242880 ] && echo "{} ($size bytes)"' \
            || true)
          if [ -n "$big" ]; then
            echo "::warning::以下文件超过 5 MB，请确认它确实该进仓库："
            echo "$big"
          fi

  validate:
    name: 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验全部翻译数据
        run: python tools/validate.py --data data --format github

      - name: 统计进度
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, io, os
          tot = done = skip = 0
          rows = []
          for p in sorted(glob.glob("data/zh-Hans/**/*.csv", recursive=True)):
              if os.path.basename(p).startswith("_"):
                  continue
              t = d = s = 0
              for r in csv.DictReader(io.open(p, encoding="utf-8", newline="")):
                  t += 1
                  if r.get("zh", "").strip():
                      d += 1
                  elif r.get("status") == "skip":
                      s += 1
              tot += t; done += d; skip += s
              rows.append((p, t, d))
          print("## 翻译进度\n")
          print("**%s / %s 行已翻译（%.2f%%）**，另有 %d 行按技术原因保留原文。\n"
                % (format(done, ","), format(tot, ","), 100.0 * done / max(tot, 1), skip))
          print("| 文件 | 行数 | 已译 | 进度 |")
          print("|---|---:|---:|---:|")
          for p, t, d in rows:
              if d < t:
                  print("| `%s` | %d | %d | %.1f%% |" % (p, t, d, 100.0 * d / t))
          PY

  tools:
    name: 工具自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 编译检查
        run: python -m compileall -q tools

      - name: 不需要游戏也应能导入的模块
        # These are the ones CI and contributors without the game rely on.
        run: |
          python -c "
          import sys; sys.path.insert(0, 'tools')
          for m in ['validate', 'repo_export', 'dehydrate', 'gamepath',
                    'gustpak', 'csvspan', 'font_atlas', 'merge_repo']:
              __import__(m)
              print('ok', m)
          "

      - name: 自检 validate.py 确实会拦住坏数据
        # A checker that passes everything is worse than none, so prove that
        # each rule actually fires.
        run: python tools/selftest_validate.py

      - name: 自检注入写对了列
        # The scripts put display text and lookup keys in the same columns, and
        # writing to the wrong one produces no visible mistranslation -- it just
        # stops the engine finding the character.  validate.py cannot see this,
        # so the injection output is checked directly.
        run: python tools/selftest_inject.py

      - name: 静态检查：未定义的名字
        # build.py once printed a variable an edit had removed.  It crashed
        # after writing the manifest, so the install still worked locally and
        # the only symptom was an exit code of 1 -- which is exactly what the
        # Windows installer checks.  None of the suites run build.py (it needs
        # the game), so this is the check that would have caught it.
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes tools native/stage1 > pyflakes.txt || true
          cat pyflakes.txt
          ! grep -E "undefined name|referenced before assignment" pyflakes.txt

      - name: 自检显示层替换表
        # The table the DLL reads is written here; the DLL's parser is checked
        # against the same format and hash in native/test/selftest.cpp.
        run: python tools/selftest_text_table.py

      - name: 自检按地址写入的主程序字符串
        # The case that matters: two copies of the same Japanese, one a label
        # and one a key, and only the label authorised -- the key must come out
        # byte for byte unchanged.  Also checks every address manifest in
        # data/exe-sites against the translations, which needs no game.
        run: |
          python tools/selftest_exe_sites.py
          python tools/exe_sites.py --check

      - name: 自检剧本交接容器
        # script.zip carries the extracted scripts between build phases: one
        # source only, damaged or duplicated members refused, merge and
        # injection read it, term counting keeps the loose files' order.
        run: python tools/selftest_workscript.py

      - name: 自检安装预检
        # Version checks on a synthetic folder, including the upgrade case:
        # an archive patched in place is read once for both of its hashes.
        run: python tools/selftest_preflight.py

      - name: 自检旧存档备忘的显示修复
        # Stored memo texts that were cut by the save's slot map to today's
        # translation only when the cut identifies one memo.
        run: python tools/selftest_old_memos.py

      - name: 自检梦世界数据表
        # Synthetic records with leftover bytes after the NUL: a translation
        # may change only the bytes its Japanese used, inside a listed field.
        run: python tools/selftest_gbd_text.py

      - name: 自检构建读取的游戏目录
        # build.py takes --game, but several modules it drives used to look the
        # game up for themselves, so a folder chosen in the installer was not
        # the one every step read.  build_font needs numpy and Pillow at import,
        # the same two the installer ships.
        run: |
          python -m pip install --quiet numpy pillow
          python tools/selftest_gamepath.py

      - name: 自检新建文件的归属
        # cielzh.dll has no original to restore, so "undo" means deleting a
        # file -- the one mistake that cannot be walked back.  Needs no game
        # files: a temporary folder stands in for the game.
        run: python tools/selftest_newfiles.py

      - name: 自检正式安装入口
        # Six problems in the install wiring got through a suite that only
        # exercised the helper module -- including a version field main() reads
        # and argparse never defined.  This drives the real main() against a
        # synthetic game folder, so no game files are needed.
        #
        # It also covers the windows a process kill can land in: the file
        # changed before the transaction knew about it, an interruption after
        # the commit point, and recovery copies that are missing or damaged.
        # Those are not reachable by raising an ordinary exception, which takes
        # the in-process rollback instead.
        run: python tools/selftest_install_flow.py

      - name: 自检安装与还原
        # The in-place patch keeps only the bytes it overwrites, so the undo
        # path has to be tested rather than assumed.
        run: python tools/selftest_install.py

  native:
    name: 原生显示层
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 编译并自检
        # The display layer replaces vtable slots in the game, so its own checks
        # matter more than usual: a recorder that folds away a nameplate change
        # or a rollback that cannot be resumed would send the whole translation
        # architecture after wrong conclusions.  None of this needs game files --
        # the test builds a synthetic image with the same vtables and thunks,
        # and the entry test drives the real emitted bytes end to end.
        shell: pwsh
        run: ./native/build.ps1

      - name: 合成 PE：加载入口、展开表与重复安装
        run: python tools/selftest_pe_loader.py
