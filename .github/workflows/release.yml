name: 发布

# The release notes are written by hand on GitHub, from the template in
# .github/RELEASE_TEMPLATE.md.  This workflow never touches a release: it used
# to open a draft and fill its body from CHANGELOG.md, and because it ran on the
# tag push, publishing a release written on the web pushed the tag, ran this,
# and overwrote the notes that had just been written.
#
# What it still does is check the data the tag points at, so a release made
# from data that does not pass validation shows up as a failed run.  CI has no
# copy of the game, so the installer is built on a maintainer's machine
# (installer/build-installer.ps1) and attached by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数据必须先通过校验
        run: python tools/validate.py --data data --format github

      - name: 自检校验工具
        run: python tools/selftest_validate.py

      - name: 提醒维护者
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 发布前

          本流程不会修改发布页面，说明请在 GitHub 上手动填写（模板见 `.github/RELEASE_TEMPLATE.md`）。

          安装程序需要在本地构建后手动上传（CI 上没有游戏文件）：

          ```powershell
          cd installer
          .\build-installer.ps1 -Version <版本号>
          ```

          然后把 `dist/` 下的 `-setup.exe` 和对应的 `.sha256` 附到发布页面上。
          EOF
